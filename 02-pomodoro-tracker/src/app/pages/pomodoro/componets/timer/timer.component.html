<div class="card">
  <p class="card__title">Pomodoro Tracker</p>
  <app-circle-percentage
    [mainColor]="progressColor"
    [secondColor]="progressBackgroundColor"
    [percentage]="percentage()"
    [remainingSeconds]="remainingSeconds"
  />

  <button class="card__button--info" (click)="start()">
    {{ startButtonText }}
  </button>
  <button
    class="card__button--danger"
    (click)="pauseOrRestore()"
    [disabled]="!pauseButtonActive"
  >
    {{ pauseButtonText }}
  </button>
</div>
