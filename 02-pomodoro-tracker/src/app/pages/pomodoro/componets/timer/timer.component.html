<div class="card">
  <p class="card__title">Pomodoro Tracker</p>
  <app-circle-percentage
    [color]="timerColor"
    [percentage]="percentage()"
    [remainingSeconds]="remainingSeconds()"
  />

  <app-circle-percentage [percentage]="percentage()" />

  <button class="card__button" (click)="start()">Start/pause</button>
  <button class="card__button" (click)="reset()">Reset</button>
</div>
