<div class="card">
  <p class="card__title">Pomodoro Tracker</p>
  <app-circle-percentage
    [mainColor]="timerStrongColor"
    [secondColor]="timerLightColor"
    [percentage]="percentage()"
    [remainingSeconds]="remainingSeconds()"
  />

  <button class="card__button--info" (click)="start()">Start Pomodoro</button>
  <button class="card__button--danger" (click)="reset()">Pause Pomodoro</button>
</div>
